<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Emotion CNN</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><p class="eyebrow">ROB311 - CNN</p><h1>Reconhecimento de emoção pela voz</h1><p>Grave até 4 segundos de fala ou envie um arquivo de áudio.</p>
<section><button id="record">Iniciar gravação</button><button id="stop" disabled>Parar</button><label class="upload">Enviar áudio <input id="file" type="file" accept="audio/*"></label></section>
